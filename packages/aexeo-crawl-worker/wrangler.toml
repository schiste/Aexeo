# Per-user Cloudflare Worker that runs runtime document evaluation for
# the emdash plugin.
# Copy this file into your own repo and fill in the placeholders before
# running `wrangler deploy`. Each plugin user owns their own Worker and
# their own auth token; nothing here is shared across sites.
#
# There is deliberately no R2 binding: the Worker used to serve aexeo-cli
# crawl artifacts from a bucket, but nothing ever called those routes
# and they exposed a full crawled copy of the site without auth. They
# were removed along with the CI workflow that uploaded the artifacts.

name = "aexeo-crawl-worker"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Note on WASM: modules-based Workers (this script is ESM) consume
# WASM via a direct `import bridgeWasm from "./bridge.wasm"` statement
# in src/wasm/init.ts. Wrangler bundles the .wasm file at deploy time
# and the import resolves to a precompiled WebAssembly.Module — no
# [wasm_modules] declaration needed and no runtime compile cost.

# Origin emdash is served from. Used as the Access-Control-Allow-Origin
# value so the browser on the admin page admits our responses. The Worker
# is not an origin of its own for this purpose; set it to the emdash
# site's URL, not the worker's.
[vars]
SITE_URL = "https://example.com"

# EVAL_TOKEN is set as a secret in production (so it never lands in
# the repo); use `wrangler secret put EVAL_TOKEN` after `wrangler deploy`.
# For LOCAL development with `wrangler dev`, secrets aren't fetched —
# put the value in .dev.vars (gitignored) instead:
#   echo "EVAL_TOKEN=<your-token>" > .dev.vars
# Use the SAME value in the emdash plugin config (AEXEO_EVAL_TOKEN env).
