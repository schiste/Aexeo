version = 1
name = "Optional sentence-opening part-of-speech review"

[[gates]]
id = "editorial.opening_pos"
kind = "custom"
extension = "syntax.opening_pos"
severity = "warning"
blocking = false
[gates.parameters]
analysis = "opening_pos"
model = "en_core_web_sm"
model_version = "3.8.0"
language = "en"
min_sentences = "2"
max_tokens = "80"
