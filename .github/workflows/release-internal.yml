name: Internal Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the release job opts in to contents: write
# below because it has to create the GitHub Release.
permissions:
  contents: read

jobs:
  # scripts/build_internal_release.sh skips the quality gate (cargo-audit,
  # cargo-deny, cargo-udeps) because ci.yml already ran it. The trigger is a
  # bare `v*` tag glob, so nothing else stops a tag on any commit producing a
  # published release. This job is what turns that reliance into a check.
  guard:
    name: Release tag guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow-level ones, so contents: read
    # has to be repeated. actions: read is what the CI conclusion query needs.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          # Ancestry cannot be tested against a shallow clone: merge-base
          # needs the full history back to the tagged commit.
          fetch-depth: 0
      - name: Fetch origin/main for the ancestry check
        # fetch-depth 0 gives the tagged commit's history but does not
        # necessarily create the origin/main remote-tracking ref, and
        # merge-base needs a real ref to compare against.
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
      - name: "Guard: tagged commit must be an ancestor of origin/main"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "release tag ${TAG} points at ${commit}, which is NOT an ancestor of origin/main." >&2
            echo "Refusing to release code that is not on main." >&2
            echo "Merge the commit to main (or retag an already-merged commit) and push the tag again." >&2
            exit 1
          fi
          echo "ok: ${TAG} -> ${commit} is an ancestor of origin/main"
      - name: "Guard: ci.yml must have succeeded on main for the tagged commit"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          python3 scripts/check-release-ci.py --repo "$REPO" --sha "$commit"
      - name: "Guard: tag must match the workspace version in Cargo.toml"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Read [workspace.package].version without cargo, so the guard stays
          # a fast preflight and cannot itself need a toolchain or a build.
          version=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                         { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              gsub(/"/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "could not read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi
          if [ "v${version}" != "$TAG" ]; then
            echo "tag ${TAG} does not match the workspace version: expected v${version}." >&2
            echo "Bump [workspace.package].version in Cargo.toml to ${TAG#v} before tagging." >&2
            exit 1
          fi
          echo "ok: ${TAG} matches [workspace.package].version ${version}"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned Rust toolchain
        id: toolchain
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Build native target
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/build_internal_release.sh --target "$TARGET"
      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aexeo-cli-${{ matrix.target }}
          path: |
            dist/aexeo-cli-${{ matrix.target }}
            dist/aexeo-cli-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all target artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Stage release directory
        run: |
          set -eu
          mkdir -p release
          # Workflow artifacts strip POSIX mode bits, so re-mark each
          # binary executable before it becomes a release asset.
          for f in artifacts/*/aexeo-cli-*; do
            case "$f" in
              *.sha256) ;;
              *)
                base=$(basename "$f")
                cp "$f" "release/$base"
                chmod +x "release/$base"
                ;;
            esac
          done
          # Re-derive the combined SHA256SUMS.txt from the staged files
          # so each line is "<hex>  <basename>" with no path prefix.
          cd release
          shasum -a 256 aexeo-cli-* > SHA256SUMS.txt
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
