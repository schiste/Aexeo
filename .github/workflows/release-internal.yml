name: Internal Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the release job opts in to contents: write
# below because it has to create the GitHub Release.
permissions:
  contents: read

jobs:
  # scripts/build_internal_release.sh skips the quality gate (cargo-audit,
  # cargo-deny, cargo-udeps) on the stated assumption that "by the time a
  # v* tag is pushed, the code at HEAD has already been gated" by ci.yml.
  # Nothing enforced that assumption: the trigger is a bare `v*` tag glob, so
  # a tag on any commit, any branch, at any point in history produces a
  # published release. This job is what turns the assumption into a check.
  guard:
    name: Release tag guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          # Ancestry cannot be tested against a shallow clone: merge-base
          # needs the full history back to the tagged commit.
          fetch-depth: 0
      - name: Fetch origin/main for the ancestry check
        # fetch-depth 0 gives the tagged commit's history but does not
        # necessarily create the origin/main remote-tracking ref, and
        # merge-base needs a real ref to compare against.
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
      - name: "Guard: tagged commit must be an ancestor of origin/main"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "release tag ${TAG} points at ${commit}, which is NOT an ancestor of origin/main." >&2
            echo "Refusing to release code that has not passed ci.yml on main." >&2
            echo "Merge the commit to main (or retag an already-merged commit) and push the tag again." >&2
            exit 1
          fi
          echo "ok: ${TAG} -> ${commit} is an ancestor of origin/main"
      - name: "Guard: tag must match the workspace version in Cargo.toml"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Read [workspace.package].version without cargo, so the guard stays
          # a fast preflight and cannot itself need a toolchain or a build.
          version=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                         { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              gsub(/"/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [ -z "$version" ]; then
            echo "could not read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi
          if [ "v${version}" != "$TAG" ]; then
            echo "tag ${TAG} does not match the workspace version: expected v${version}." >&2
            echo "Bump [workspace.package].version in Cargo.toml to ${TAG#v} before tagging." >&2
            exit 1
          fi
          echo "ok: ${TAG} matches [workspace.package].version ${version}"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Build native target
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/build_internal_release.sh --target "$TARGET"
      - name: Upload target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aexeo-cli-${{ matrix.target }}
          path: |
            dist/aexeo-cli-${{ matrix.target }}
            dist/aexeo-cli-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download all target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Stage release directory
        run: |
          set -eu
          mkdir -p release
          # Workflow artifacts strip POSIX mode bits, so re-mark each
          # binary executable before it becomes a release asset.
          for f in artifacts/*/aexeo-cli-*; do
            case "$f" in
              *.sha256) ;;
              *)
                base=$(basename "$f")
                cp "$f" "release/$base"
                chmod +x "release/$base"
                ;;
            esac
          done
          # Re-derive the combined SHA256SUMS.txt from the staged files
          # so each line is "<hex>  <basename>" with no path prefix.
          cd release
          shasum -a 256 aexeo-cli-* > SHA256SUMS.txt
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
