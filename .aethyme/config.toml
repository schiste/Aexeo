# Aethyme broker configuration. `aethyme init` documents every key.
schema = 1

[promote]
# Verify submissions but promote nothing: this repository delivers through
# pull requests, so each session branch is the only copy of its work.
mode = "verify-only"

[delivery]
# Agents may push their own session branch and open a draft PR
# (`aethyme broker push --session <id> [--pr]`). Nothing else.
push_session_branches = true

[cleanup]
# Only ignored output with an in-repository producer is disposable. Root reports,
# Wrangler state, and tracked declaration files stay protected.
regenerable = [
    "crates/aexeo-cli/tests/fixtures/chau7-mini-site/.aexeo-reports",
    "packages/aexeo-emdash/wasm/aexeo_emdash_bridge.js",
    "packages/aexeo-emdash/wasm/aexeo_emdash_bridge_bg.js",
    "packages/aexeo-emdash/wasm/aexeo_emdash_bridge_bg.wasm",
    "packages/aexeo-emdash/wasm/aexeo_emdash_bridge_bg.wasm.d.ts",
    "packages/aexeo-crawl-worker/src/wasm/aexeo_emdash_bridge.js",
    "packages/aexeo-crawl-worker/src/wasm/aexeo_emdash_bridge_bg.js",
    "packages/aexeo-crawl-worker/src/wasm/aexeo_emdash_bridge_bg.wasm",
]
