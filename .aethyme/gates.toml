# Generated by `aethyme init`, reviewed on 2026-11-08.
# Rules: commands run with cwd = the worktree under test (bare —
# no venv/node_modules); gate outputs must be gitignored.
reviewed = true
schema = 1

# Rust tests read fixtures beyond `.rs` files (crates/**/tests, docs/ examples,
# scripts/), and the toolchain pin and lockfile change what compiles, so those
# trigger the gate too. A trigger that names nothing silently disables the gate.
[[gate]]
name = "cargo-test"
command = "cargo test --workspace --quiet --manifest-path Cargo.toml"
cost = 3
timeout_seconds = 1800
triggers = [
  "crates/**",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "docs/**",
  "scripts/**",
]
