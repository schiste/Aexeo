# Pinned toolchain for the workspace.
#
# An exact release, so a new stable cannot turn CI red on an unrelated commit
# or make a release build differ from the commit CI checked. Dependabot proposes
# bumps (.github/dependabot.yml); ci.yml and release-internal.yml read the
# channel from this file. This is the toolchain development uses; the oldest
# one the workspace supports is `rust-version` in Cargo.toml, checked by the
# msrv job in ci.yml.
#
# The components are the ones `scripts/check-code.sh` and
# `scripts/clippy-strict.sh` invoke. The target is the one
# `packages/aexeo-emdash/scripts/build-wasm.sh` needs: rustup keeps targets per
# toolchain, so without it every bump would strand that build.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
