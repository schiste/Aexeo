version = 1
name = "External linguistic review starter"

# These names identify host-supplied observers, not built-in language models.
# Override the entire gate with the locale and register used by your project.
[[gates]]
id = "linguistic.register"
kind = "custom"
extension = "linguistic.register"
blocking = false
[gates.parameters]
locale = "und"
register = "unspecified"

[[gates]]
id = "linguistic.idiom"
kind = "custom"
extension = "linguistic.idiom"
blocking = false
[gates.parameters]
locale = "und"

[[gates]]
id = "linguistic.reference_fidelity"
kind = "custom"
extension = "linguistic.reference_fidelity"
blocking = false
[gates.parameters]
locale = "und"
reference = "original"

# A provider must analyze sentence boundaries and grammatical categories for
# the configured locale. A missing or unsupported provider stays not_checked.
[[gates]]
id = "linguistic.opening_categories"
kind = "custom"
extension = "linguistic.opening_categories"
blocking = false
[gates.parameters]
locale = "und"

# Clause analysis is language-dependent; this slot does not imply that an
# analyzer is installed or that every sentence must alternate mechanically.
[[gates]]
id = "linguistic.clause_structure"
kind = "custom"
extension = "linguistic.clause_structure"
blocking = false
[gates.parameters]
locale = "und"
