version = 1
name = "External linguistic review starter"

# These names identify host-supplied observers, not built-in language models.
# Override the entire gate with the locale and register used by your project.
[[gates]]
id = "linguistic.register"
kind = "custom"
extension = "linguistic.register"
blocking = false
[gates.parameters]
locale = "und"
register = "unspecified"

[[gates]]
id = "linguistic.idiom"
kind = "custom"
extension = "linguistic.idiom"
blocking = false
[gates.parameters]
locale = "und"

[[gates]]
id = "linguistic.reference_fidelity"
kind = "custom"
extension = "linguistic.reference_fidelity"
blocking = false
[gates.parameters]
locale = "und"
reference = "original"

# Configure a locally installed parser model, version and language before use.
# See adapters/syntax for the provider and model-specific parameters.
[[gates]]
id = "linguistic.opening_categories"
kind = "custom"
extension = "syntax.opening_pos"
blocking = false
[gates.parameters]
analysis = "opening_pos"
model = "unspecified"
model_version = "unspecified"
language = "und"
min_sentences = "2"
max_tokens = "80"

[[gates]]
id = "linguistic.clause_structure"
kind = "custom"
extension = "syntax.clause_alternation"
blocking = false
[gates.parameters]
analysis = "clause_alternation"
model = "unspecified"
model_version = "unspecified"
language = "und"
min_sentences = "2"
max_tokens = "80"
subordinate_labels = "advcl,acl:relcl,ccomp"
short_max_words = "11"
