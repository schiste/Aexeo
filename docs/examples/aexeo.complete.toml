#:schema ../config.schema.json

# Generated by aexeo-cli docs generate. Do not edit by hand.
#
# Sets every documented config key at its canonical location, except the
# reserved `plugin_settings`. Values show the shape of each key and differ from
# the defaults on purpose; this is a reference, not a recommended configuration.
# `aexeo-cli docs check` fails unless it passes both the JSON Schema and the
# loader, so a key added to one but not the other cannot go unnoticed.

version = 1
profile = "chau7"
plugins = ["example-plugin"]
extends = ["aexeo.v1.toml"]
max_workers = 2
# `orphan_exclude` and `[checks]` have no complete nested form yet, so they stay
# at the root and warn with CFGDEP001.
orphan_exclude = ["offline.html"]

[checks]
headers = false

[site]
url = "https://example.com"
source_dir = "dist"
adapter = "astro-dist"
canonical_style = "trailing-slash"

[runtime]
engine = "playwright"
wait_until = "load"
headers = { "X-Example" = "1" }
cookies = [{ name = "session", value = "example" }]
basic_auth = { username = "user", password = "example" }
seeds = ["/start"]
include_patterns = ["/docs/"]
exclude_patterns = ["/private/"]
use_sitemap = false
capture_trace = true
capture_screenshot = true
capture_console = true
capture_network = true
artifact_dir = ".aexeo-reports/example-artifacts"

[policy]
ignore_rules = ["SCH012"]
ignore_paths = ["drafts/"]
severity_overrides = { EDT001 = "error" }
suppressions = [{ rule_id = "SEO001", path_pattern = "/legacy/", reason = "Scheduled for removal", expires = "2030-01-01" }]
route_policy_overrides = [{ pattern = "/preview/", allow_canonical_noindex = true, allow_nofollow = true }]

[editorial.routes."/guides/example"]
answer_summary_id = "answer-summary"
target_questions = [{ heading_id = "pricing", question = "How does pricing compare?" }]
claims_requiring_evidence = ["benchmark"]

[route_kinds.manifesto]
match = ["/foundations/"]
skip_rules = ["GEO007"]
noindex = true

[accessibility]
strict = true

[agent_discovery]
enabled = true

[rules.html]
enabled = true
require_html_lang = false
require_hreflang_self = true

[rules.links]
enabled = true
min_inbound_links = 2
link_suggestion_count = 5
enable_link_autofix = true
related_links_heading = "See also"
weak_anchor_text = ["here"]

[rules.schema]
enabled = true
required_types = ["Article"]
required_families = ["article"]
require_breadcrumb_schema = true
require_title_alignment = false

[rules.sitemap]
enabled = true

[rules.robots]
enabled = true
require_sitemap = false
require_meta_consistency = false

[rules.social]
enabled = true
require_open_graph = false
require_twitter_card = false
default_twitter_card = "summary_large_image"
require_social_images = false
require_twitter_image = true

[rules.llm]
enabled = true

[rules.surfaces]
enabled = true

[rules.content]
enabled = true
min_page_size = 800
required_feature_markers = ["Example marker"]

[rules.editorial]
enabled = true

[rules.structure]
enabled = true
repeatable_data_ui = ["tile"]
utility_route_patterns = ["account"]
min_block_text_length = 200
min_answer_blocks = 3
require_fact_consistency = false

[output]
baseline_file = ".example-baseline.json"
audit_log_limit = 9

[quality]
performance_budget_file = "example-budget.json"
